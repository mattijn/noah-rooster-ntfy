name: Rooster

on:
  schedule:
    # Met een tijdzone per regel; zonder dat zou alles UTC zijn en twee keer
    # per jaar een uur verschuiven.
    # Voor 07:00 zet de school nog niets bij; eerder kijken heeft geen zin.
    - cron: "15 7 * * 1-5"     # ochtendbericht
      timezone: "Europe/Amsterdam"
    # Niet op het hele uur: dat is volgens de documentatie het drukste moment,
    # en dan worden runs niet alleen vertraagd maar soms weggegooid.
    - cron: "20 7-17 * * 1-5"  # elk uur tijdens schooltijd
      timezone: "Europe/Amsterdam"
    - cron: "45 18 * * 0-4"    # morgen alvast weten, avond voor een schooldag
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      altijd:
        description: "Ook pushen als er niets gewijzigd is"
        type: boolean
        default: false

# Twee gelijktijdige runs betekent gegarandeerd een ingetrokken refresh token.
# Nooit cancelen: een run die halverwege stopt laat ons buitengesloten achter.
concurrency:
  group: rooster
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Zodat we na de eerste geplande run kunnen zien wat github.event.schedule
      # teruggeeft nu er een tijdzone bij staat; daar hangt het vaste bericht op.
      - name: Welke planning trok dit
        run: echo "schedule=[${{ github.event.schedule }}] event=${{ github.event_name }}"

      - name: Playwright
        run: pip install --quiet playwright

      # Zowel het token als de opgeslagen stand: in state.json staat het rooster
      # met vakken, lokalen, docenten en toetsonderwerpen, en dat hoort niet
      # leesbaar in een repo.
      - name: Ontsleutelen
        env:
          TOKEN_PASS: ${{ secrets.TOKEN_PASS }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in tokens.enc -out tokens.json \
            -pass env:TOKEN_PASS
          chmod 600 tokens.json
          if [ -s state.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in state.enc -out state.json \
              -pass env:TOKEN_PASS
            chmod 600 state.json
          fi

      - name: Rooster controleren
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # De ochtendrun stuurt altijd een bericht met de agenda; de uurruns
          # alleen als er echt iets gewijzigd is.
          ALTIJD: ${{ (github.event.schedule == '15 7 * * 1-5' || github.event.schedule == '45 18 * * 0-4' || inputs.altijd) && '--altijd' || '' }}
        run: python3 somtoday_rooster.py check --notify --kaart --dagen 3 --vooruit 14 $ALTIJD

      # Moet ook draaien als de stap hierboven faalt: het token kan dan al
      # geroteerd zijn, en het oude is vanaf dat moment waardeloos.
      - name: Geroteerde stand terugschrijven
        if: always()
        env:
          TOKEN_PASS: ${{ secrets.TOKEN_PASS }}
        run: |
          if [ ! -s tokens.json ]; then
            echo "Geen tokens.json; niets terug te schrijven." && exit 0
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt -in tokens.json -out tokens.enc \
            -pass env:TOKEN_PASS
          rm -f tokens.json
          if [ -s state.json ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -in state.json -out state.enc \
              -pass env:TOKEN_PASS
            rm -f state.json
          fi
          git config user.name  "rooster-bot"
          git config user.email "rooster-bot@users.noreply.github.com"
          git add tokens.enc state.enc
          git diff --cached --quiet || git commit -m "rooster: stand bijgewerkt [skip ci]"
          git push
